# SPDX-License-Identifier: MIT
# Build + test check on every push to main (and manually). The built zip is
# kept as a workflow artifact for inspection.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # caller must grant the permissions the called job requests
    # (reusable-workflow rule: nested jobs can't exceed the caller's)
    permissions:
      contents: read
      actions: write
    with:
      version: ci
