name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "jka_key_len=$(printf '%s' "${{ secrets.JKA_ANIMKIT_DEPLOY_KEY }}" | wc -c)"
          echo "probe_len=$(printf '%s' "${{ secrets.PROBE_SECRET }}" | wc -c)"
          printf '%s' "${{ secrets.JKA_ANIMKIT_DEPLOY_KEY }}" | head -c 20 | od -c | head -2
