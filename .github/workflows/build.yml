# SPDX-License-Identifier: MIT
# Reusable build of the JKA animation suite distribution zip.
#
# Sources (none committed to this repo — sanitize policy, decision #3):
#   * jka-animkit   — private, same owner; pinned via packaging/animkit.lock.
#     The default GITHUB_TOKEN cannot read other repos, so the workflow uses
#     a read-only deploy key (repo secret JKA_ANIMKIT_DEPLOY_KEY) and a
#     shallow fetch of the pinned full SHA.
#   * jediacademy   — mrwonko/Blender-Jedi-Academy-Tools (the public
#     successor of the cagelight fork), pinned to tag v2.1.0. The v0.1.0
#     fixture zip was verified byte-identical to that tag's plugin zip
#     (all 25 files, 2026-11-19); we build it with upstream's own Makefile
#     target so CI ships exactly the tested plugin.
name: Build suite

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the zip (e.g. 0.1.0)
        required: true
        type: string
    outputs:
      zip_path:
        description: Path (on the runner) of the built zip
        value: ${{ jobs.build.outputs.zip_path }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # artifact upload
    outputs:
      zip_path: ${{ steps.zip.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned jka-animkit ref
        id: ak
        run: echo "ref=$(grep -v '^#' packaging/animkit.lock | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Write jka-animkit deploy key (read-only, base64'd secret)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          base64 -d > ~/.ssh/ak_deploy <<'EOF'
          ${{ secrets.JKA_ANIMKIT_DEPLOY_KEY }}
          EOF
          chmod 600 ~/.ssh/ak_deploy
          # fail fast with diagnostics if the secret ever gets mangled
          if ! ssh-keygen -y -f ~/.ssh/ak_deploy > /dev/null 2>&1; then
            echo "deploy key invalid:"; wc -c ~/.ssh/ak_deploy
            head -c 60 ~/.ssh/ak_deploy | od -c | head -3; exit 1
          fi
          echo "deploy key OK"

      - name: Checkout jka-animkit (pinned, private)
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/ak_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: |
          git init vendor/jka-animkit
          git -C vendor/jka-animkit remote add origin git@github.com:Jrbesse/jka-animkit.git
          git -C vendor/jka-animkit fetch --depth 1 origin "${{ steps.ak.outputs.ref }}"
          git -C vendor/jka-animkit checkout "${{ steps.ak.outputs.ref }}"

      - name: Checkout jediacademy dep (pinned public tag)
        uses: actions/checkout@v4
        with:
          repository: mrwonko/Blender-Jedi-Academy-Tools
          ref: v2.1.0
          path: vendor/jediacademy
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the jediacademy plugin zip (upstream Makefile target)
        run: make -C vendor/jediacademy build/jediacademy.zip

      # test_paths.py is a standalone script (sys.exit style), not a unittest
      # module — run it separately; the rest is plain unittest. Fixtures ride
      # along in the jka-animkit checkout (JKA_ANIMKIT_DIR).
      - name: Unit tests
        env:
          JKA_ANIMKIT_DIR: ${{ github.workspace }}/vendor/jka-animkit
        run: |
          python -m unittest -v tests.test_anims tests.test_checkop tests.test_fingers
          python tests/test_paths.py

      - name: Build the distribution zip
        run: |
          python packaging/build_release.py \
            --version "${{ inputs.version }}" \
            --animkit-src vendor/jka-animkit \
            --jediacademy-zip vendor/jediacademy/build/jediacademy.zip \
            --out /tmp/dist

      - id: zip
        run: echo "path=/tmp/dist/jka-anim-suite-${{ inputs.version }}.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jka-anim-suite-${{ inputs.version }}
          path: /tmp/dist/jka-anim-suite-${{ inputs.version }}.zip
          if-no-files-found: error
