# SPDX-License-Identifier: MIT
# Cuts a GitHub Release with the distribution zip.
#
# Triggers:
#   * push of a version tag  (vX.Y.Z — version taken from the tag)
#   * workflow_dispatch with an explicit version input
#
# The zip is built by the reusable build workflow (tests + pinned sources);
# the release job only downloads the artifact and attaches it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z)"
        required: true
        type: string
        default: "0.1.0"

jobs:
  ver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: ver
    uses: ./.github/workflows/build.yml
    # caller must grant the permissions the called job requests
    # (reusable-workflow rule: nested jobs can't exceed the caller's)
    permissions:
      contents: read
      actions: write
    with:
      version: ${{ needs.ver.outputs.version }}

  release:
    needs: [ver, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # artifact download
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jka-anim-suite-${{ needs.ver.outputs.version }}
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.ver.outputs.version }}
          files: out/jka-anim-suite-${{ needs.ver.outputs.version }}.zip
          generate_notes: true
